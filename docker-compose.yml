# Docker Compose configuration for data-sync-opensearch

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: 'l9mJqFQwS4eYc1pKZJ1tng'
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "8084:8080"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"

  connect:
    image: debezium/connect:2.5
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    volumes:
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - ./opensearch/config/log4j2.properties:/usr/share/opensearch/config/log4j2.properties
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  opensearch-dashboard:
    image: opensearchproject/opensearch-dashboards:2.11.0
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: "[\"http://opensearch:9200\"]"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"

  ops-console:
    profiles: ["ops"]
    build:
      context: ./ops-console
      dockerfile: Dockerfile
    working_dir: ${PWD:-/workspace}
    volumes:
      - .:${PWD:-/workspace}
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      OPS_CONSOLE_WORKDIR: ${PWD:-/workspace}
      OPS_CONSOLE_COMPOSE_PROJECT_NAME: data-sync-opensearch
      OPS_CONSOLE_PRODUCER_URL: http://producer:8080
      OPS_CONSOLE_CONSUMER_URL: http://consumer:8080
      OPS_CONSOLE_OPENSEARCH_URL: http://opensearch:9200
      OPS_CONSOLE_KAFBAT_URL: http://localhost:8084
      OPS_CONSOLE_KAFKA_UI_URL: http://localhost:8081
      OPS_CONSOLE_OPENSEARCH_DASHBOARD_URL: http://localhost:${DASHBOARDS_PORT:-5601}
      OPS_CONSOLE_BENCHMARK_REPORT_PATH: ${PWD:-/workspace}/benchmark/reports
      OPS_CONSOLE_CONSUMER_GROUP: cdc-consumer-group
    ports:
      - "${OPS_CONSOLE_PORT:-8090}:8090"

  consumer:
    profiles: ["app"]
    build:
      context: ./consumer
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      CONSUMER_GROUP: cdc-consumer-group
      OPENSEARCH_URL: http://opensearch:9200
      HEALTH_PORT: "8080"
      WORKER_COUNT: ${CONSUMER_WORKER_COUNT:-20}
      BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-100}
      QUEUE_SIZE: ${CONSUMER_QUEUE_SIZE:-2000}
      PAUSE_THRESHOLD: ${CONSUMER_PAUSE_THRESHOLD:-0.8}
      RESUME_THRESHOLD: ${CONSUMER_RESUME_THRESHOLD:-0.4}
    expose:
      - "8080"
    restart: unless-stopped

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRODUCER_PORT: 8080
      PRODUCER_METRICS_PORT: 9090
      PRODUCER_DB_HOST: postgres
      PRODUCER_DB_PORT: 5432
      PRODUCER_DB_USER: ${POSTGRES_USER:-app}
      PRODUCER_DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      PRODUCER_DB_NAME: ${POSTGRES_DB:-app}
    ports:
      - "8082:8080" # Exposed on different port than consumer to avoid conflict
      - "9091:9090"
    restart: unless-stopped

  benchmark:
    profiles: ["benchmark"]
    image: data-sync/benchmark:latest
    depends_on:
      - producer
    volumes:
      - ./benchmark/scripts:/scripts:ro
      - ./benchmark/reports:/reports
    environment:
      BENCHMARK_BASE_URL: ${BENCHMARK_BASE_URL:-http://producer:8080}
      BENCHMARK_SCENARIO: ${BENCHMARK_SCENARIO:-sustained}
      BENCHMARK_TARGET_RPS: ${BENCHMARK_TARGET_RPS:-500}
      BENCHMARK_DURATION: ${BENCHMARK_DURATION:-120s}
      BENCHMARK_PREALLOCATED_VUS: ${BENCHMARK_PREALLOCATED_VUS:-100}
      BENCHMARK_MAX_VUS: ${BENCHMARK_MAX_VUS:-300}
      BENCHMARK_SETUP_USERS: ${BENCHMARK_SETUP_USERS:-200}
      BENCHMARK_SETUP_VIDEOS: ${BENCHMARK_SETUP_VIDEOS:-100}
      BENCHMARK_SETUP_COMMENTS: ${BENCHMARK_SETUP_COMMENTS:-100}
    # Shell form so BENCHMARK_SCENARIO is resolved at runtime for the output filename
    entrypoint: ["/bin/sh", "-c", "k6 run /scripts/main.js --out json=/reports/$${BENCHMARK_SCENARIO:-sustained}-raw.ndjson"]

volumes:
  kafka_data:
  opensearch_data:
